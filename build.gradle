plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        villagefriends {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.14.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
test { useJUnitPlatform() }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'villagefriends-tests'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        clearRunDirectory = false
        username = 'VillageTester'
    }
}

// Focused content/asset validation, without rerunning the long friendship fixtures.
tasks.named('processGametestResources') {
    def foundationOnly = providers.gradleProperty('foundationOnly').isPresent()
    def structuresOnly = providers.gradleProperty('structuresOnly').isPresent()
    def animationsOnly = providers.gradleProperty('animationsOnly').isPresent()
    def outfitsOnly = providers.gradleProperty('outfitsOnly').isPresent()
    def hairFacesOnly = providers.gradleProperty('hairFacesOnly').isPresent()
    def villageGallery = providers.gradleProperty('villageGallery').isPresent()
    inputs.property 'villageGallery', villageGallery
    def residentSample = providers.gradleProperty('residentSample').isPresent()
    inputs.property 'residentSample', residentSample
    def guardsOnly = providers.gradleProperty('guardsOnly').isPresent()
    def companionsOnly = providers.gradleProperty('companionsOnly').isPresent()
    def villageLifeOnly = providers.gradleProperty('villageLifeOnly').isPresent()
    inputs.property 'villageLifeOnly', villageLifeOnly
    inputs.property 'foundationOnly', foundationOnly
    inputs.property 'structuresOnly', structuresOnly
    inputs.property 'animationsOnly', animationsOnly
    inputs.property 'outfitsOnly', outfitsOnly
    inputs.property 'hairFacesOnly', hairFacesOnly
    inputs.property 'guardsOnly', guardsOnly
    inputs.property 'companionsOnly', companionsOnly
    doLast {
        if (foundationOnly || structuresOnly || animationsOnly || outfitsOnly || hairFacesOnly || villageGallery || residentSample || guardsOnly || companionsOnly || villageLifeOnly) {
            def descriptor = new File(destinationDir, 'fabric.mod.json')
            def metadata = new groovy.json.JsonSlurper().parse(descriptor)
            metadata.entrypoints['fabric-client-gametest'] = [guardsOnly ? 'dev.villagefriends.GuardGameTest' : residentSample ? 'dev.villagefriends.ResidentSampleGameTest' : villageGallery ? 'dev.villagefriends.VillageGalleryGameTest' : hairFacesOnly ? 'dev.villagefriends.HairFaceGameTest' : outfitsOnly ? 'dev.villagefriends.OutfitGameTest' : animationsOnly ? 'dev.villagefriends.AnimationGameTest' : structuresOnly ? 'dev.villagefriends.StructuresGameTest' : 'dev.villagefriends.FoundationGameTest']
            if (companionsOnly && !guardsOnly) metadata.entrypoints['fabric-client-gametest'] = ['dev.villagefriends.FriendshipGameTest', 'dev.villagefriends.RoadmapGameTest', 'dev.villagefriends.VillageLifeGameTest']
            if (villageLifeOnly) metadata.entrypoints['fabric-client-gametest'] = ['dev.villagefriends.VillageLifeGameTest']
            if (guardsOnly) metadata.entrypoints['fabric-client-gametest'] = ['dev.villagefriends.GuardSpawnEggGameTest', 'dev.villagefriends.GuardGameTest', 'dev.villagefriends.GuardProgressGameTest']
            descriptor.setText(new groovy.json.JsonBuilder(metadata).toPrettyString() + '\n', 'UTF-8')
        }
    }
}

// The art-direction gallery (-PvillageGallery) takes its template list and village count from
// -Pgallery=tavern,cottage_oak and -PgalleryVillages=2. The resident sample (-PresidentSample)
// draws five random men and women; -PsampleSeed=123 repeats a draw. The village survey
// (-Ptests=VillageSurveyGameTest) takes -PsurveySeed, -PsurveyCount, -PsurveyTypes and -PsurveyShots.
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    systemProperty 'villagefriends.gallery', providers.gradleProperty('gallery').getOrElse('')
    systemProperty 'villagefriends.galleryVillages', providers.gradleProperty('galleryVillages').getOrElse('2')
    systemProperty 'villagefriends.sampleSeed', providers.gradleProperty('sampleSeed').getOrElse('')
    systemProperty 'villagefriends.surveySeed', providers.gradleProperty('surveySeed').getOrElse('1')
    systemProperty 'villagefriends.surveyCount', providers.gradleProperty('surveyCount').getOrElse('4')
    systemProperty 'villagefriends.surveyTypes', providers.gradleProperty('surveyTypes').getOrElse('')
    systemProperty 'villagefriends.surveyShots', providers.gradleProperty('surveyShots').getOrElse('true')
    systemProperty 'villagefriends.galleryWait', providers.gradleProperty('galleryWait').getOrElse('160')
}

// Development runs use a separate world folder and a recognizable player name.
loom.runs {
    client { programArgs '--username', 'VillageTester' }
}

// Animation pack checks (-PanimationPack) and the showcase film (-PanimationVideo, development only:
// it writes numbered frames under build/run/clientGameTest/screenshots for tools/animations/film.py).
tasks.named('processGametestResources') {
    def animationPack = providers.gradleProperty('animationPack').isPresent()
    def animationVideo = providers.gradleProperty('animationVideo').isPresent()
    inputs.property 'animationPack', animationPack
    inputs.property 'animationVideo', animationVideo
    doLast {
        if (animationPack || animationVideo) {
            def descriptor = new File(destinationDir, 'fabric.mod.json')
            def metadata = new groovy.json.JsonSlurper().parse(descriptor)
            metadata.entrypoints['fabric-client-gametest'] = [animationVideo ? 'dev.villagefriends.AnimationFilmGameTest' : 'dev.villagefriends.AnimationPackGameTest']
            descriptor.setText(new groovy.json.JsonBuilder(metadata).toPrettyString() + '\n', 'UTF-8')
        }
    }
}
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    systemProperty 'villagefriends.filmScenes', providers.gradleProperty('filmScenes').getOrElse('')
    systemProperty 'villagefriends.filmStride', providers.gradleProperty('filmStride').getOrElse('1')
}

// Any set of gameplay tests by class name: -Ptests=CommunityGameTest,VillageLifeGameTest
tasks.named('processGametestResources') {
    def selected = providers.gradleProperty('tests').getOrElse('')
    inputs.property 'tests', selected
    doLast {
        if (!selected.isBlank()) {
            def descriptor = new File(destinationDir, 'fabric.mod.json')
            def metadata = new groovy.json.JsonSlurper().parse(descriptor)
            metadata.entrypoints['fabric-client-gametest'] = selected.split(',').collect { 'dev.villagefriends.' + it.trim() }
            descriptor.setText(new groovy.json.JsonBuilder(metadata).toPrettyString() + '\n', 'UTF-8')
        }
    }
}
