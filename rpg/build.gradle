plugins {
    id 'net.fabricmc.fabric-loom'
}

// Village Friends RPG is its own mod and jar; it needs Village Friends (the root project) to run.
version = '1.2.0'
group = 'dev.villagefriends'
base { archivesName = 'villagefriends-rpg' }
evaluationDependsOn(':')

loom {
    splitEnvironmentSourceSets()
    mods {
        villagefriends_rpg {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        villagefriends {
            sourceSet rootProject.sourceSets.main
            sourceSet rootProject.sourceSets.client
        }
    }
}

repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation rootProject.sourceSets.main.output
    clientImplementation rootProject.sourceSets.client.output
    testImplementation platform('org.junit:junit-bom:5.14.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
test { useJUnitPlatform() }
// gradlew :rpg:runServer -Paudit=true -PpackMods=<folder> also loads the other modpack jars in <folder> (e.g. the
// Village Friends instance's mods folder), so the audit checks every cross-mod name against the real game.
// Fabric API, Village Friends and this add-on's own jars are skipped: the dev builds are used instead.
tasks.matching { it.name == 'runServer' }.configureEach {
    doFirst {
        def mods = file('run/mods')
        delete(fileTree(mods) { include '*.jar' })
        if (project.hasProperty('packMods')) {
            copy {
                from(project.property('packMods')) { include '*.jar'; exclude 'fabric-api*', 'village-friends-*', 'villagefriends-rpg-*' }
                into mods
            }
            println 'Modpack run with: ' + fileTree(mods).files*.name.sort()
        }
    }
}
loom.runs {
    client { programArgs '--username', 'VillageTester' }
    server { programArgs 'nogui'; vmArg '-Xmx' + providers.gradleProperty('serverHeap').getOrElse('1024m'); vmArg '-Dvillagefriends_rpg.audit=' + providers.gradleProperty('audit').getOrElse('false') }
}
